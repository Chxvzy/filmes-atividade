<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Filme</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="form-container">
        <h1 id="titulo-pagina">Cadastrar Novo Filme</h1>

        <form id="form-filme">
            <div class="input-group">
                <label for="titulo_filme">Título do Filme</label>
                <input type="text" id="titulo_filme" placeholder="Ex: Inception" required>
            </div>

            <div class="input-group">
                <label for="genero">Gênero</label>
                <input type="text" id="genero" placeholder="Ex: Ficção Científica" required>
            </div>

            <div class="input-group">
                <label for="duracao">Duração (minutos)</label>
                <input type="number" id="duracao" placeholder="Ex: 148" required>
            </div>

            <div class="input-group">
                <label for="classificacao_etaria">Classificação Etária (0 para Livre)</label>
                <input type="number" id="classificacao_etaria" placeholder="Ex: 14" required>
            </div>

            <button type="submit" id="btn-submit">Salvar Filme</button>
        </form>

        <a href="../index.html" class="link-voltar">Voltar para o catálogo</a>
    </div>

    <script src="cadastro.js"></script>
</body>
</html>
