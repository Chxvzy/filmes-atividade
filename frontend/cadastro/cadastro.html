<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Filme</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <header class="navbar">
        <label class="switch" title="Alternar tema">
            <input type="checkbox" id="btn-theme">
            <span class="slider"></span>
        </label>
    </header>

    <main class="container">
        <div class="form-wrapper">
            <!-- Painel Decorativo -->
            <div class="form-banner">
                <div class="banner-content">
                    <h2 id="banner-titulo">Gestão de Filmes</h2>
                    <p id="banner-descricao">Adicione ou edite as informações dos filmes da sua coleção de forma simples e rápida.</p>
                </div>
            </div>

            <!-- Formulário -->
            <div class="form-card">
                <h1 id="titulo-pagina">Cadastrar Novo Filme</h1>

                <form id="form-filme">
                    <div class="input-group">
                        <label for="titulo_filme">Título do Filme</label>
                        <input type="text" id="titulo_filme" placeholder="Informe o título" required>
                    </div>

                    <div class="input-group">
                        <label for="genero">Gênero</label>
                        <input type="text" id="genero" placeholder="Informe o gênero" required>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label for="duracao">Duração (min)</label>
                            <input type="number" id="duracao" placeholder="Ex: 120" min="1" required>
                        </div>

                        <div class="input-group">
                            <label for="classificacao_etaria">Classificação (Anos)</label>
                            <input type="number" id="classificacao_etaria" placeholder="Ex: 12 (0 = Livre)" min="0" required>
                        </div>
                    </div>

                    <button type="submit" id="btn-submit">Cadastrar Filme</button>
                </form>

                <a href="../index.html" class="link-voltar">← Voltar para o catálogo</a>
            </div>
        </div>
    </main>

    <script src="cadastro.js"></script>
</body>
</html>
